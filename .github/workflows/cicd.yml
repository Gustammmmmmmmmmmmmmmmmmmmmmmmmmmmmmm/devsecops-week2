name: DevSecOps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Run Unit Tests
        run: pytest
        env:
          PYTHONPATH: . # <-- FIX 1: Menambahkan PYTHONPATH

      - name: Security Scan
        run: bandit -r src -l M # <-- FIX 2: Mengatur level severity ke Medium

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-test         # <-- Ini adalah bagian penting CI/CD
    if: github.ref == 'refs/heads/main' # <-- Hanya deploy jika push ke main
    steps:
      - name: Simulate Deployment
        run: echo "Deploying application to staging..."
